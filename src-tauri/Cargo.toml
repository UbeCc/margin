[package]
name = "margin"
version = "0.1.0"
description = "Margin - a WYSIWYG Markdown editor"
authors = ["Margin contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.5"
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
percent-encoding = "2"
tempfile = "3"
log = "0.4"
libc = "0.2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL", "NSGeometry", "NSDictionary", "NSObject", "NSFileManager"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSPrintInfo", "NSPrintOperation", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "WKNavigationDelegate", "WKNavigation", "WKWebViewConfiguration", "WKPreferences", "block2", "objc2-app-kit"] }
block2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }

[[test]]
name = "menu_main"
harness = false

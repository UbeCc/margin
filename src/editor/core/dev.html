<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin core — dev</title>
    <style>
      :root { --margin-fg: #24292f; --margin-bg: #fff; --margin-accent: #4a7cf7; --margin-code-bg: #f6f8fa; }
      body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--margin-fg); background: var(--margin-bg); }
      header { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; padding: 6px 16px; background: var(--margin-bg); border-bottom: 1px solid rgba(127,127,127,.25); }
      #host { max-width: 820px; margin: 0 auto; padding: 24px; }
      #status { font: 11px ui-monospace, Menlo, monospace; opacity: .7; }
    </style>
  </head>
  <body>
    <header>
      <button id="source" type="button">Source</button>
      <button id="export" type="button">renderHTML</button>
      <span id="status"></span>
    </header>
    <div id="host" class="margin-doc editor-host"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
